name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Third-party notices are up to date
        run: |
          npm run notices
          git diff --exit-code THIRD_PARTY_NOTICES.md || (echo "Run 'npm run notices' and commit THIRD_PARTY_NOTICES.md." && exit 1)
